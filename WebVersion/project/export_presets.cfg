[preset.0]
name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features="rainrot_web"
export_filter="all_resources"
include_filter="assets/manifest.json,ASSET_LICENSES.md,LICENSE,assets/models/enemies/*/SOURCE.json,assets/models/enemies/*/LICENSE.txt"
exclude_filter="captures/*,logs/*,assets/models/enemies/*/model.gltf,assets/models/enemies/*/model.bin,scenes/props/patient.tscn"
export_path="../site/game.html"
script_export_mode=1

[preset.0.options]
custom_template/debug="../toolchain/web_nothreads_debug.zip"
custom_template/release="../toolchain/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
