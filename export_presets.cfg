[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="assets/manifest.json,ASSET_LICENSES.md,LICENSE,assets/models/enemies/*/SOURCE.json,assets/models/enemies/*/LICENSE.txt"
exclude_filter="WebVersion/*,delivery/*,captures/*,logs/*,docs/*,.github/*"
export_path="delivery/windows/RAINROT.exe"
script_export_mode=1

[preset.0.options]
custom_template/debug=""
custom_template/release=".runtime/windows-toolchain/windows_release_x86_64.exe"
binary_format/architecture="x86_64"
binary_format/embed_pck=false
debug/export_console_wrapper=0
codesign/enable=false
application/modify_resources=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
